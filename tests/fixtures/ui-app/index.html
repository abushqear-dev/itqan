<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shifts</title>
<style>
  :root { --bg:#ffffff; --text:#1a1a1a; --primary:#0b5fff; --danger:#c62828; --sm:8px; --md:16px; --radius:8px; }
  * { margin:0; box-sizing:border-box; }
  body { font:16px/1.5 system-ui, sans-serif; color:var(--text); background:var(--bg); padding:var(--md); }
  main { display:flex; flex-direction:column; gap:var(--md); max-width:640px; }
  h1 { font-size:24px; }
  nav a { display:inline-block; padding:var(--sm) var(--md); min-height:44px; color:var(--primary); transition:background-color 200ms; border-radius:var(--radius); }
  nav a:hover { background:#e8f0ff; }
  nav a:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  button { font:inherit; min-height:44px; padding:var(--sm) var(--md); border:0; border-radius:var(--radius); background:var(--primary); color:#fff; cursor:pointer; transition:background-color 200ms; }
  button:hover { background:#0847c4; }
  button:active { background:#063a9e; }
  button:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  button:disabled { background:#cfd6e4; color:#1a1a1a; cursor:not-allowed; }
  input { font:inherit; min-height:44px; padding:var(--sm) var(--md); border:1px solid #6b6b6b; border-radius:var(--radius); color:var(--text); }
  input:hover { border-color:var(--text); }
  input:focus { outline:2px solid var(--primary); outline-offset:2px; border-color:var(--primary); }
  ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:var(--sm); }
  .skeleton { height:24px; background:#e6e6e6; border-radius:var(--radius); animation:shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { 50% { opacity:.5; } }
  .error { color:var(--danger); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Shifts</h1>
  <nav aria-label="Main"><a href="/">Home</a> <a href="/bad">Other</a></nav>
  <label for="q">Search shifts</label>
  <input id="q" type="search" placeholder="Name">
  <div><button type="button">Sign up</button> <button type="button" disabled>Cancel spot</button></div>
  <section id="out" aria-live="polite"><div class="skeleton" role="status" aria-label="Loading"></div></section>
</main>
<script>
  const out = document.getElementById('out');
  fetch('/api/shifts').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((list) => {
    if (!list.length) { out.innerHTML = '<p>No shifts this week. Published shifts will appear here.</p>'; return; }
    out.innerHTML = '<ul>' + list.map((s) => `<li>${s.name}: ${s.spots} spots free</li>`).join('') + '</ul>';
  }).catch(() => { out.innerHTML = '<p class="error">Could not load shifts. Try again.</p>'; });
</script>
</body>
</html>
